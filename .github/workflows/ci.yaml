name: CI
on:
  push:
    branches:
      - main
  # Plain pull_request: PR code never runs with a secret. The live suite runs
  # after merge, on main, and gates the release instead of the merge.
  pull_request:
    branches:
      - main
  workflow_dispatch: {}
  schedule:
    # “At 08:55 on every day-of-week from Monday through Friday.”
    #
    # Staggered across the six SDK repos (java :30, python :35, php :40,
    # go :45, csharp :50, typescript :55). They all run their live suites
    # against the one shared e2e sandbox, and firing together stampedes the
    # auth path's cold public-key cache -> Envelope /decrypt times out at 3s
    # -> every endpoint 500s (Sentry CORE-API-1N0). Keep these apart.
    - cron: 55 8 * * 1-5

# A new push to a PR cancels the previous in-flight run. Runs on main are never
# cancelled: the publish workflow waits for each one to finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Everything that needs no secret: lint, type-check, and the offline auth and
  # webhook tests. This is all a PR gets before merge.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 24.x

      - name: Install dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run offline tests
        run: npx vitest run tests/auth.test.js tests/webhook.test.ts

  # The live suite against the e2e sandbox. Runs on main only (push, schedule,
  # dispatch). The key lives in the `e2e` Environment, which only main can use,
  # so a branch workflow can't read it.
  test:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.x
          - 24.x
        # Each test file provisions its own merchant account, so vitest can
        # safely distribute the files across shards.
        #
        # Kept at 2 (not 4) deliberately: every shard is a live-API job that
        # authenticates against the shared e2e sandbox. Concurrent cold-cache
        # auth calls are what tip core-api's Envelope /decrypt over its 3s
        # timeout and 500 the whole suite. If you add shards here, bump the
        # `--shard=N/M` denominator in the run step to match.
        shard:
          - 1
          - 2

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm i

      - name: Run tests
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          npx vitest run --testTimeout=30000 --hookTimeout=30000 --shard=${{ matrix.shard }}/2

  # Single, stable status check for the branch ruleset to require. On a PR it
  # means the offline checks passed; on main it also means the live suite
  # passed, which is what the publish workflow waits for.
  ci-complete:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        env:
          CHECKS: ${{ needs.checks.result }}
          TEST: ${{ needs.test.result }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$CHECKS" != "success" ]; then
            echo "checks result: $CHECKS"
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ] && [ "$TEST" = "skipped" ]; then
            exit 0
          fi
          if [ "$TEST" != "success" ]; then
            echo "test matrix result: $TEST"
            exit 1
          fi

  # Endpoint reach of the live suite, written to the run summary. Generated SDK
  # PRs add new `src/funcs/*` operations but no E2E tests; this lists every
  # operation the suite does not yet reach, so we can add tests over time.
  # continue-on-error keeps a failed report from failing the CI run, which is
  # what the publish workflow waits for.
  coverage:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: e2e

    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22.x
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm i

      # continue-on-error so a broken suite still writes the report (flagged as
      # incomplete below). The last step turns the job red again.
      - name: Run tests with coverage
        id: suite
        continue-on-error: true
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          # Record outgoing HTTP calls so endpoint reach is measured from real
          # requests, not statement coverage.
          GR4VY_TRACK_HTTP: "1"
        run: npx vitest run --coverage --testTimeout=30000 --hookTimeout=30000

      - name: Build endpoint coverage report
        run: node scripts/endpoint-coverage.mjs

      - name: Write the report to the run summary
        env:
          SUITE: ${{ steps.suite.outcome }}
        run: |
          if [ "$SUITE" != "success" ]; then
            echo "> ⚠️ **The test suite failed in this run, so the reach below is incomplete.**" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          cat coverage/endpoint-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Read unreached endpoints
        id: report
        run: |
          {
            echo "summary=$(grep -o '[0-9]* / [0-9]*' coverage/endpoint-coverage.md | head -1)"
            echo "missing<<EOF"
            grep '^- `' coverage/endpoint-coverage.md || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post unreached endpoints to Slack
        if: steps.report.outputs.missing != ''
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: TypeScript SDK
            SLACK_TITLE: TypeScript SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "warning"
            SLACK_MESSAGE: "Endpoint coverage ${{ steps.report.outputs.summary }}. No live test reached:\n${{ steps.report.outputs.missing }}"
            SLACK_FOOTER: ""

      - name: Fail if the test suite failed
        if: steps.suite.outcome != 'success'
        run: exit 1

  notify:
    needs: [checks, test]
    runs-on: ubuntu-latest
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'gr4vy-sdk-generate[bot]')
        env:
            SLACK_USERNAME: TypeScript SDK
            SLACK_TITLE: TypeScript SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy
            SLACK_ICON_EMOJI: ":gr4vy-sdk:"
            SLACK_COLOR: "failure"
            SLACK_MESSAGE_ON_FAILURE: "CI failed"
            SLACK_FOOTER: ""
