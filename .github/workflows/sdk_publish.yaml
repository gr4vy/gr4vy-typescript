name: Publish SDK
"on":
  workflow_run: # zizmor: ignore[dangerous-triggers] never checks out or runs PR code
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      mode: ${{ github.event_name == 'workflow_dispatch' && 'manual' || steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - id: gate
        uses: gr4vy/sdk-release/publish-gate@0d6218b18c2c2f495a206efebea008ba96b174bb
        with:
          head-sha: ${{ github.event.workflow_run.head_sha || github.sha }}
          bot-login: gr4vy-sdk-release[bot]

  request-approval:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: TypeScript SDK
            SLACK_TITLE: TypeScript SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "#F3AB0E"
            SLACK_MESSAGE: "v${{ needs.gate.outputs.version }} is waiting for release approval: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            SLACK_FOOTER: ""

  approve:
    needs: gate
    if: needs.gate.outputs.publish == 'true' && needs.gate.outputs.mode == 'manual'
    runs-on: ubuntu-latest
    environment: release-manual
    steps:
      - run: echo "Release approved."

  publish:
    needs: [gate, approve]
    if: >-
      always() && needs.gate.outputs.publish == 'true' &&
      (needs.gate.outputs.mode == 'auto' || needs.approve.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sdk-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint a gr4vy-sdk-release token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.SDK_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Check out the release commit
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Publish to npm
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          PACKAGE_VERSION=$(npm pkg get version | tr -d '"')
          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json is $PACKAGE_VERSION but gen.lock is $VERSION"
            exit 1
          fi
          if npm view "@gr4vy/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@gr4vy/sdk@$VERSION is already on npm"
          elif [[ "$VERSION" == *-* ]]; then
            PRERELEASE=${VERSION#*-}
            npm publish --access public --tag "${PRERELEASE%%.*}"
          else
            npm publish --access public
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "[@gr4vy/sdk $VERSION](https://www.npmjs.com/package/@gr4vy/sdk/v/$VERSION)"
            echo
            yq -r '.releaseNotes' .speakeasy/gen.lock
          } > release-notes.md
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "typescript - v$VERSION" --notes-file release-notes.md

  notify:
    needs: [gate, publish]
    runs-on: ubuntu-latest
    if: always() && (needs.gate.result == 'failure' || needs.publish.result != 'skipped')
    steps:
      - name: Slack Notification
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2
        env:
            SLACK_USERNAME: TypeScript SDK 
            SLACK_TITLE: TypeScript SDK
            SLACK_WEBHOOK: ${{ secrets.SLACK_SDK_WEBHOOK_URL }}
            SLACK_CHANNEL: sdk-updates
            SLACK_MSG_AUTHOR: gr4vy-code
            SLACK_ICON_EMOJI: ":gr4vy:"
            SLACK_COLOR: "${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}"
            SLACK_MESSAGE_ON_SUCCESS: "SDK publishing succeeded - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_MESSAGE_ON_FAILURE: "SDK publishing failed - `${{ github.event.workflow_run.head_commit.message || 'manual dispatch' }}`"
            SLACK_FOOTER: ""

  dispatch:
    needs: publish
    strategy:
      matrix:
        repo:
          - gr4vy/gr4vy-docs-mintlify
    runs-on: ubuntu-latest
    steps:
      - name: Notify SDKs
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.DISPATCH_ACCESS_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: sdk_updated
